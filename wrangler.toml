name = "scout-analyst-pipeline"
main = "src/worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Scheduled execution every 15 minutes + on-demand via /api/scan and /api/platforms/scan-url
[triggers]
crons = ["*/15 * * * *"]

# Cloudflare Workers AI binding (used for ingestion enrichment, geo-verification, and CV/cover-letter matching)
[ai]
binding = "AI"

# Optional Cloudflare D1 SQL Database binding (uncomment and set database_id after `npx wrangler d1 create bolivia_remote_db`)
# [[d1_databases]]
# binding = "DB"
# database_name = "bolivia_remote_db"
# database_id = "00000000-0000-0000-0000-000000000000"

# Optional Cloudflare Vectorize Index binding (uncomment after `npx wrangler vectorize create bolivia-remote-jobs --dimensions=1024 --metric=cosine`)
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "bolivia-remote-jobs"

# Optional Raspberry Pi 5 Qdrant Edge Bridge (e.g. edge-rag-hub Qdrant v1.12)
# [vars]
# QDRANT_URL = "http://localhost:6333"
# QDRANT_COLLECTION = "bolivia_remote_jobs"

[observability]
enabled = true
